name: Release

# Publishes every (baseline, carrier) pair with exact, distro-line and, on the
# alias carrier, short tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "libfaketime version, e.g. 0.9.13"
        required: true
      force:
        description: "rebuild and overwrite already published tags"
        type: boolean
        default: false
      dry_run:
        description: "build and verify everything, push nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      floor: ${{ steps.ver.outputs.floor }}
      url: ${{ steps.pin.outputs.url }}
      sha: ${{ steps.pin.outputs.sha }}
      pairs: ${{ steps.pairs.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      # Versions contain no hyphen, so a tag is <version>[-<release revision>].
      # Event and input values go through env vars, never into shell syntax.
      - name: Derive version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            tag="v${tag#v}"          # accept both 0.9.13 and v0.9.13
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          version="${version%%-*}"
          case "$version" in
            *[!0-9.]*|"")
              echo "cannot read a version out of tag '$tag'" >&2
              exit 1
              ;;
          esac
          # A tag ending in -glibc<A.B> scopes the release to that one baseline;
          # a bare version tag covers every baseline in the lock file.
          floor=""
          case "$tag" in
            *-glibc*)
              floor="${tag##*-glibc}"
              case "$floor" in
                *[!0-9.]*|"")
                  echo "cannot read a glibc floor out of tag '$tag'" >&2
                  exit 1
                  ;;
              esac
              ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "floor=$floor"
          } >> "$GITHUB_OUTPUT"

      - name: Read build baselines
        id: bases
        env:
          FLOOR: ${{ steps.ver.outputs.floor }}
        run: |
          list="["
          while IFS=$'\t' read -r image glibc archived make_mode; do
            case "$image" in ''|'#'*) continue ;; esac
            case "$glibc" in
              ''|*[!0-9.]*)
                echo "baseline $image has no valid glibc value" >&2
                exit 1
                ;;
            esac
            if [ -z "$make_mode" ]; then
              echo "baseline $image has no make value" >&2
              exit 1
            fi
            if [ -n "$FLOOR" ] && [ "$glibc" != "$FLOOR" ]; then
              continue
            fi
            list="$list{\"image\":\"$image\",\"glibc\":\"$glibc\",\"archived\":\"$archived\",\"make\":\"$make_mode\"},"
          done < docker/build-base.lock
          list="${list%,}]"
          if [ "$list" = "[]" ]; then
            if [ -n "$FLOOR" ]; then
              echo "no baseline with glibc $FLOOR in docker/build-base.lock" >&2
            else
              echo "docker/build-base.lock has no baselines" >&2
            fi
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # Resolve each carrier once, pair it with baselines at or below its
      # glibc, and require the alias carrier to carry every baseline.
      - name: Resolve carrier pairs
        id: pairs
        env:
          BASELINES: ${{ steps.bases.outputs.list }}
        run: |
          set -eux
          lower_than() { [ "$1" != "$2" ] && [ "$1" = "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" ]; }

          pairs="["
          while IFS=$'\t' read -r distro carrier locked_glibc alias; do
            case "$distro" in ''|'#'*) continue ;; esac
            case "$locked_glibc" in
              ''|*[!0-9.]*)
                echo "carrier for distro $distro has no valid glibc value" >&2
                exit 1
                ;;
            esac

            info="$(docker run --rm "debian:$carrier" sh -c 'cat /etc/debian_version; getconf GNU_LIBC_VERSION | cut -d" " -f2')"
            point="$(printf '%s\n' "$info" | sed -n 1p)"
            carrier_glibc="$(printf '%s\n' "$info" | sed -n 2p)"
            case "$point" in
              ''|*[!0-9.]*)
                echo "no point release resolved for debian:$carrier" >&2
                exit 1
                ;;
            esac
            if [ "$carrier_glibc" != "$locked_glibc" ]; then
              echo "docker/bases.lock says $carrier runs glibc $locked_glibc, image reports $carrier_glibc" >&2
              exit 1
            fi

            while read -r base; do
              glibc="$(printf '%s' "$base" | jq -r '.glibc')"
              baseline="$(printf '%s' "$base" | jq -r '.image')"
              archived="$(printf '%s' "$base" | jq -r '.archived')"
              make_mode="$(printf '%s' "$base" | jq -r '.make')"
              if lower_than "$carrier_glibc" "$glibc"; then
                if [ -n "$alias" ]; then
                  echo "alias carrier $carrier (glibc $carrier_glibc) cannot carry baseline glibc $glibc" >&2
                  exit 1
                fi
                echo "skip debian$distro ($carrier, glibc $carrier_glibc) for baseline glibc $glibc"
                continue
              fi
              pairs="$pairs{\"glibc\":\"$glibc\",\"baseline\":\"$baseline\",\"archived\":\"$archived\",\"make\":\"$make_mode\",\"distro\":\"$distro\",\"carrier\":\"$carrier\",\"point\":\"$point\",\"alias\":\"$alias\",\"carrier_glibc\":\"$carrier_glibc\"},"
            done < <(printf '%s' "$BASELINES" | jq -c '.[]')
          done < docker/bases.lock
          pairs="${pairs%,}]"

          while read -r glibc; do
            n="$(printf '%s' "$pairs" | jq --arg g "$glibc" '[.[] | select(.glibc == $g)] | length')"
            if [ "$n" -eq 0 ]; then
              echo "no carrier can carry baseline glibc $glibc" >&2
              exit 1
            fi
          done < <(printf '%s' "$BASELINES" | jq -r '.[].glibc')

          echo "pairs=$pairs"
          echo "list=$pairs" >> "$GITHUB_OUTPUT"

      - name: Read pin from docker/versions.lock
        id: pin
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          row="$(awk -F'\t' -v v="$VERSION" '!/^#/ && $1 == v { print; found = 1 } END { if (!found) exit 1 }' docker/versions.lock)" || {
            echo "version $VERSION is not listed in docker/versions.lock" >&2
            exit 1
          }
          sha="$(printf '%s' "$row" | cut -f3)"
          case "$sha" in
            ""|TODO*)
              echo "version $VERSION is not pinned; run scripts/update-lock.sh $VERSION" >&2
              exit 1
              ;;
          esac
          {
            echo "url=$(printf '%s' "$row" | cut -f2)"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One compile per baseline, one cheap final stage per compatible carrier.
      # Nothing is published here; the gate decides after the measurement.
      - name: Build carriers
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          URL: ${{ needs.resolve.outputs.url }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
          ARCH: ${{ matrix.arch }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eux
          label() { docker image inspect "libfaketime:$1" --format "{{ index .Config.Labels \"$2\" }}"; }
          check() {
            actual="$(label "$1" "$2")"
            if [ "$actual" != "$3" ]; then
              echo "carrier $1: label $2 is '$actual', expected '$3'" >&2
              exit 1
            fi
          }

          : > "reused-$ARCH.txt"
          built=0
          while read -r pair; do
            glibc="$(printf '%s' "$pair" | jq -r '.glibc')"
            cflags="$(./scripts/cflags.sh "$VERSION" "$glibc")"
            baseline="$(printf '%s' "$pair" | jq -r '.baseline')"
            archived="$(printf '%s' "$pair" | jq -r '.archived')"
            make_mode="$(printf '%s' "$pair" | jq -r '.make')"
            distro="$(printf '%s' "$pair" | jq -r '.distro')"
            carrier="$(printf '%s' "$pair" | jq -r '.carrier')"
            point="$(printf '%s' "$pair" | jq -r '.point')"

            local="libfaketime:$glibc-$distro"
            exact="v${VERSION}-glibc${glibc}-debian${point}"
            major="v${VERSION}-glibc${glibc}-debian${distro}"

            # Only the exact tag is unique to this build, so existence is decided on it.
            if [ "${FORCE:-false}" != "true" ] && docker manifest inspect "$IMAGE:$exact" > /dev/null 2>&1; then
              # Reuse the published image so a rerun still packages assets.
              echo "$IMAGE:$exact already published; reusing it for glibc$glibc debian$distro"
              docker pull "$IMAGE:$exact"
              docker tag "$IMAGE:$exact" "$local"
              echo "$glibc $distro" >> "reused-$ARCH.txt"
              continue
            fi

            # The local image is what gets tested, probed and packaged.
            args=(
              --build-arg "BASE_TAG=$baseline"
              --build-arg "GLIBC=$glibc"
              --build-arg "APT_ARCHIVE=$archived"
              --build-arg "TOOLCHAIN_MAKE=$make_mode"
              --build-arg "FINAL_BASE=$carrier"
              --build-arg "LIBFAKETIME_VERSION=$VERSION"
              --build-arg "LIBFAKETIME_URL=$URL"
              --build-arg "LIBFAKETIME_SHA256=$SHA"
              --build-arg "EXTRA_CFLAGS=$cflags"
              --build-arg "IMAGE_VERSION=$exact"
              --build-arg "VCS_REF=$(git rev-parse --short HEAD)"
              --build-arg "RELEASE_TAG=$RELEASE_TAG"
            )
            docker buildx build "${args[@]}" --load -t "$local" .

            check "$glibc-$distro" org.opencontainers.image.version "$exact"
            check "$glibc-$distro" com.libfaketime.version "$VERSION"
            check "$glibc-$distro" com.libfaketime.source.sha256 "$SHA"
            check "$glibc-$distro" com.libfaketime.build.glibc "$glibc"
            check "$glibc-$distro" com.libfaketime.build.base "debian:$baseline"
            check "$glibc-$distro" com.libfaketime.runtime.base "debian:$carrier"

            echo "built glibc$glibc debian$distro from $carrier ($point, $ARCH)"
            built=$((built + 1))
          done < <(printf '%s' "$PAIRS" | jq -c '.[]')

          echo "built $built carrier image(s) for $ARCH"

      # Each carrier is measured on itself: the gate below is per tag, so a tag
      # that hangs on its own base is refused without touching its siblings.
      - name: Measure carriers
        env:
          IMAGE: arsiachou/libfaketime
          CONTAINER_ENGINE: docker
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
        run: |
          set -eux
          rm -rf "compat-$ARCH"
          mkdir -p "compat-$ARCH"
          for glibc in $(printf '%s' "$PAIRS" | jq -r '[.[].glibc] | unique | .[]'); do
            refs=''
            while read -r distro point; do
              ref="$IMAGE:v${VERSION}-glibc${glibc}-debian${point}"
              docker tag "libfaketime:$glibc-$distro" "$ref"
              refs="$refs $ref"
            done < <(printf '%s' "$PAIRS" | jq -r --arg g "$glibc" '.[] | select(.glibc == $g) | "\(.distro) \(.point)"')

            GLIBC_FLOOR="$glibc" JSON_OUT="compat-$ARCH/glibc-$glibc.json" \
              ./scripts/capabilities.sh $refs > "compat-$ARCH/glibc-$glibc.md"

            # Carriers of one baseline carry the same library, so a differing
            # digest means the table is describing two different artifacts.
            same="$(jq '[.[].sha] | unique | length' "compat-$ARCH/glibc-$glibc.json")"
            if [ "$same" != "1" ]; then
              echo "carriers of baseline glibc $glibc ship different libraries" >&2
              exit 1
            fi

            {
              echo "### Compatibility ($ARCH, glibc $glibc)"
              echo
              cat "compat-$ARCH/glibc-$glibc.md"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

          jq -s 'add' "compat-$ARCH"/*.json > "compat-$ARCH.json"

      # Only carriers whose verdict is ok or degraded reach the registry; the
      # merge job turns the digests into tags.
      - name: Publish passing carriers
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          URL: ${{ needs.resolve.outputs.url }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
          ARCH: ${{ matrix.arch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eux
          status="status-$ARCH.txt"
          : > "$status"
          while read -r pair; do
            glibc="$(printf '%s' "$pair" | jq -r '.glibc')"
            cflags="$(./scripts/cflags.sh "$VERSION" "$glibc")"
            baseline="$(printf '%s' "$pair" | jq -r '.baseline')"
            archived="$(printf '%s' "$pair" | jq -r '.archived')"
            make_mode="$(printf '%s' "$pair" | jq -r '.make')"
            distro="$(printf '%s' "$pair" | jq -r '.distro')"
            carrier="$(printf '%s' "$pair" | jq -r '.carrier')"
            point="$(printf '%s' "$pair" | jq -r '.point')"

            exact="v${VERSION}-glibc${glibc}-debian${point}"
            major="v${VERSION}-glibc${glibc}-debian${distro}"
            verdict="$(jq -r --arg t "$exact" '.[] | select(.tag == $t) | .verdict' "compat-$ARCH.json")"

            case "$verdict" in
              ok|degraded) ;;
              *)
                echo "$glibc $distro skip - $exact" >> "$status"
                echo "- `$exact` / `$major` refused: $verdict" >> "$GITHUB_STEP_SUMMARY"
                continue
                ;;
            esac

            if grep -qx "$glibc $distro" "reused-$ARCH.txt"; then
              echo "$glibc $distro pass - $exact" >> "$status"
              echo "- `$exact` / `$major` unchanged (already published)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "$glibc $distro pass - $exact" >> "$status"
              echo "- `$exact` / `$major` would be published ($verdict)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            args=(
              --build-arg "BASE_TAG=$baseline"
              --build-arg "GLIBC=$glibc"
              --build-arg "APT_ARCHIVE=$archived"
              --build-arg "TOOLCHAIN_MAKE=$make_mode"
              --build-arg "FINAL_BASE=$carrier"
              --build-arg "LIBFAKETIME_VERSION=$VERSION"
              --build-arg "LIBFAKETIME_URL=$URL"
              --build-arg "LIBFAKETIME_SHA256=$SHA"
              --build-arg "EXTRA_CFLAGS=$cflags"
              --build-arg "IMAGE_VERSION=$exact"
              --build-arg "VCS_REF=$(git rev-parse --short HEAD)"
              --build-arg "RELEASE_TAG=$RELEASE_TAG"
            )
            meta="meta-$glibc-$distro.json"
            docker buildx build "${args[@]}" \
              --provenance=false --sbom=false \
              --output "type=image,name=$IMAGE,push=true,push-by-digest=true,name-canonical=true" \
              --metadata-file "$meta" .
            digest="$(jq -r '."containerimage.digest"' "$meta")"
            case "$digest" in
              ""|null) echo "no digest returned for glibc$glibc debian$distro" >&2; exit 1 ;;
            esac
            echo "$glibc $distro pass $digest $exact" >> "$status"
            echo "- `$exact` / `$major` published ($verdict)" >> "$GITHUB_STEP_SUMMARY"
          done < <(printf '%s' "$PAIRS" | jq -c '.[]')

          echo "status for $ARCH:"
          cat "$status"

      - name: Package binary artifacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
        run: |
          set -eux
          # A refused carrier has no published tag, so it has nothing to ship.
          awk '$3 == "pass" { print $1, $2 }' "status-$ARCH.txt" | sort -uV > "passing-$ARCH.txt"
          if [ ! -s "passing-$ARCH.txt" ]; then
            echo "no carrier passed for $ARCH; nothing to package"
            exit 0
          fi

          for glibc in $(awk '{ print $1 }' "passing-$ARCH.txt" | sort -uV); do
            # Prefer the alias carrier so the archive matches the short tag, but
            # only when that carrier is one of the passing ones.
            distro="$(printf '%s' "$PAIRS" | jq -r --arg g "$glibc" '
              [ .[] | select(.glibc == $g) ] |
              (([.[] | select(.alias == "1")][0]) // .[0]) | .distro')"
            if ! awk -v g="$glibc" -v d="$distro" '$1 == g && $2 == d { found = 1 } END { exit !found }' "passing-$ARCH.txt"; then
              distro="$(awk -v g="$glibc" '$1 == g { print $2; exit }' "passing-$ARCH.txt")"
            fi

            # The archive mirrors /, so it unpacks with tar -C /; docker cp
            # needs the parent directories and the trailing /.
            image="libfaketime:$glibc-$distro"
            name="libfaketime-${VERSION}-glibc${glibc}-${ARCH}"
            mkdir -p "dist/$name/lib/faketime" "dist/$name/bin"
            cid="$(docker create "$image")"
            docker cp "$cid:/usr/local/lib/faketime/." "dist/$name/lib/faketime"
            docker cp "$cid:/usr/local/bin/faketime" "dist/$name/bin/faketime"
            docker cp "$cid:/usr/src" "dist/$name/src"
            docker rm -v "$cid" > /dev/null
            tar -C dist -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: libfaketime-*.tar.gz*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.arch }}
          path: |
            compat-${{ matrix.arch }}.json
            status-${{ matrix.arch }}.txt
          if-no-files-found: error

  merge:
    name: merge-glibc${{ matrix.glibc }}-debian${{ matrix.distro }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v5

      # The gate decided which carriers may exist; the digests come with it.
      - uses: actions/download-artifact@v4
        with:
          path: gate
          pattern: gate-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the tag hierarchy
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          GLIBC: ${{ matrix.glibc }}
          DISTRO: ${{ matrix.distro }}
          POINT: ${{ matrix.point }}
          ALIAS: ${{ matrix.alias }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eux
          case "$POINT" in
            ""|null) echo "no point release resolved for glibc $GLIBC debian$DISTRO" >&2; exit 1 ;;
          esac

          exact="v${VERSION}-glibc${GLIBC}-debian${POINT}"
          major="v${VERSION}-glibc${GLIBC}-debian${DISTRO}"
          short="v${VERSION}-glibc${GLIBC}"

          # A tag is multi-arch, so one refused architecture refuses the pair.
          state_of() {
            awk -v g="$GLIBC" -v d="$DISTRO" '$1 == g && $2 == d { print $3 }' "gate/status-$1.txt" 2>/dev/null
          }
          digest_of() {
            awk -v g="$GLIBC" -v d="$DISTRO" '$1 == g && $2 == d { print $4 }' "gate/status-$1.txt" 2>/dev/null
          }

          amd_state="$(state_of amd64)"
          arm_state="$(state_of arm64)"
          if [ "$amd_state" != pass ] || [ "$arm_state" != pass ]; then
            echo "glibc $GLIBC debian$DISTRO stays unpublished: amd64=${amd_state:-missing} arm64=${arm_state:-missing}"
            echo "- glibc $GLIBC debian$DISTRO skipped (amd64 ${amd_state:-missing}, arm64 ${arm_state:-missing})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry run: would create $IMAGE:$exact, $IMAGE:$major"
            if [ -n "$ALIAS" ]; then echo "dry run: would create $IMAGE:$short"; fi
            exit 0
          fi

          amd="$(digest_of amd64)"
          arm="$(digest_of arm64)"
          # A reused image was not pushed again, so its digest is read back.
          if [ -z "$amd" ] || [ "$amd" = "-" ] || [ -z "$arm" ] || [ "$arm" = "-" ]; then
            # Nothing was rebuilt: read the digests from the published index.
            raw="$(docker buildx imagetools inspect --raw "$IMAGE:$exact")"
            amd="$(printf '%s' "$raw" | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')"
            arm="$(printf '%s' "$raw" | jq -r '.manifests[] | select(.platform.architecture == "arm64") | .digest')"
          fi

          create() {
            docker buildx imagetools create -t "$IMAGE:$1" \
              "$IMAGE@$amd" "$IMAGE@$arm"
            platforms="$(docker buildx imagetools inspect "$IMAGE:$1" | grep -c 'Platform:')"
            if [ "$platforms" -lt 2 ]; then
              echo "expected 2 platforms in $1, found $platforms" >&2
              exit 1
            fi
            echo "published $1"
          }

          # Exact tags are snapshots and never move.
          if [ "${FORCE:-false}" = "true" ] || ! docker manifest inspect "$IMAGE:$exact" > /dev/null 2>&1; then
            create "$exact"
          else
            echo "$exact already published; leaving it alone"
          fi

          # Distro-line and short tags are pointers and must follow new point releases.
          create "$major"
          # The alias=1 carrier decides which tag the short name follows.
          if [ -n "$ALIAS" ]; then
            create "$short"
          fi

  assets:
    name: publish-artifacts
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      # A release where nothing passed publishes the report alone, so the
      # archive download may legitimately have nothing to fetch.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: gate
          pattern: gate-*
          merge-multiple: true

      # The report is rebuilt from the measured rows, so the published decision
      # and the table come from the same data.
      - name: Assemble the compatibility table
        id: report
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          FLOOR: ${{ needs.resolve.outputs.floor }}
        run: |
          set -eux
          mkdir -p dist
          for arch in amd64 arm64; do
            test -f "gate/compat-$arch.json"
            test -f "gate/status-$arch.txt"
          done

          jq -s 'add' gate/compat-amd64.json gate/compat-arm64.json > dist/rows.json

          # A tag is multi-arch, so it counts as published only if both
          # architectures passed it.
          amd_pass="$(awk '$3 == "pass" { print $5 }' gate/status-amd64.txt | sort)"
          arm_pass="$(awk '$3 == "pass" { print $5 }' gate/status-arm64.txt | sort)"
          published="$(comm -12 <(printf '%s\n' "$amd_pass") <(printf '%s\n' "$arm_pass") | grep -v '^$' || true)"
          total="$(jq -r '[.[].tag] | unique | length' dist/rows.json)"
          count="$(printf '%s\n' "$published" | grep -c . || true)"

          jq --arg tags "$published" '
            ($tags | split("\n") | map(select(length > 0))) as $p
            | map(. as $row | . + {pushed: (if ($p | index($row.tag)) then "yes" else "no" end)})
          ' dist/rows.json | jq 'sort_by(.tag, .arch)' > dist/rows-marked.json

          # The file name carries the floor so a release never shares a name with
          # a sibling floor.
          suffix=""
          if [ -n "${FLOOR:-}" ]; then suffix="-glibc$FLOOR"; fi
          out="dist/libfaketime-${VERSION}${suffix}-compatibility.md"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          {
            echo "## Compatibility: libfaketime ${VERSION} (glibc ${FLOOR:-all})"
            echo
            echo "${count} of ${total} tags published"
            echo
            ./scripts/capabilities.sh --notes --render dist/rows-marked.json
          } > "$out"
          cat "$out"

      - uses: softprops/action-gh-release@v2
        if: inputs.dry_run != true
        with:
          files: |
            dist/libfaketime-*.tar.gz*
            dist/libfaketime-*-compatibility.md
          # Pin the release to the intended tag, not the dispatched branch.
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: libfaketime ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          # The measured table is the release note, generated from the same rows
          # that decided which tags were published.
          body_path: ${{ steps.report.outputs.path }}
          append_body: true
          # A rerun replaces existing assets instead of failing.
          overwrite_files: true
