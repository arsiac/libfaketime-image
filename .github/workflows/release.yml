name: Release

# A tag publishes one libfaketime release across every carrier in
# docker/bases.lock. The artifact is compiled once per architecture on the
# single baseline in docker/build-base.lock, then copied into each carrier, so
# the .so is byte-identical everywhere and only the base system differs.
#
# Each carrier publishes three levels of tag, the way language runtimes do:
#   v0.9.13-glibc2.31-debian11.11   exact point release that was built against
#   v0.9.13-glibc2.31-debian11      follows the 11.x line
#   v0.9.13-glibc2.31               follows the carrier marked alias=1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "libfaketime version, e.g. 0.9.13"
        required: true
      force:
        description: "rebuild and overwrite already published tags"
        type: boolean
        default: false
      dry_run:
        description: "build and verify everything, push nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      url: ${{ steps.pin.outputs.url }}
      sha: ${{ steps.pin.outputs.sha }}
      cflags: ${{ steps.pin.outputs.cflags }}
      baseline: ${{ steps.base.outputs.baseline }}
      glibc: ${{ steps.base.outputs.glibc }}
      archived: ${{ steps.base.outputs.archived }}
      carriers: ${{ steps.matrix.outputs.carriers }}
      points: ${{ steps.points.outputs.map }}
    steps:
      - uses: actions/checkout@v5

      # A git tag is <version> optionally followed by a release revision, e.g.
      # v0.9.13, v0.9.13-20270101, v0.9.13-debian14. Upstream versions contain
      # no hyphen, so the version is everything before the first one and the
      # suffix only distinguishes releases that carry the same version.
      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
            tag="v${tag#v}"          # accept both 0.9.13 and v0.9.13
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          version="${version%%-*}"
          case "$version" in
            *[!0-9.]*|"")
              echo "cannot read a version out of tag '$tag'" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Read build baseline
        id: base
        run: |
          row="$(awk -F'\t' '!/^#/ && NF { print }' docker/build-base.lock)"
          {
            echo "baseline=$(printf '%s' "$row" | cut -f1)"
            echo "glibc=$(printf '%s' "$row" | cut -f2)"
            echo "archived=$(printf '%s' "$row" | cut -f3)"
          } >> "$GITHUB_OUTPUT"

      # The merge matrix is derived from docker/bases.lock, so adding a carrier
      # there is enough: a hardcoded list here would silently never merge a new
      # distro.
      - name: Emit carrier matrix
        id: matrix
        run: |
          list="$(awk -F'\t' '!/^#/ && NF { printf "\"%s\",", $1 }' docker/bases.lock | sed 's/,$//')"
          echo "carriers=[$list]" >> "$GITHUB_OUTPUT"

      # The carrier tags float on the newest point release, so it is resolved
      # exactly once here and handed to both jobs. Resolving it again in the
      # merge job would let a point release published mid-run produce a tag name
      # the build never pushed.
      - name: Resolve point releases
        id: points
        run: |
          json="{"
          while IFS=$'\t' read -r distro carrier _alias; do
            case "$distro" in ''|'#'*) continue ;; esac
            point="$(docker run --rm "debian:$carrier" cat /etc/debian_version)"
            json="$json\"$distro\":\"$point\","
          done < docker/bases.lock
          json="${json%,}}"
          echo "map=$json" >> "$GITHUB_OUTPUT"

      - name: Read pin from docker/versions.lock
        id: pin
        run: |
          version="${{ steps.ver.outputs.version }}"
          row="$(awk -F'\t' -v v="$version" '!/^#/ && $1 == v { print; found = 1 } END { if (!found) exit 1 }' docker/versions.lock)" || {
            echo "version $version is not listed in docker/versions.lock" >&2
            exit 1
          }
          sha="$(printf '%s' "$row" | cut -f3)"
          case "$sha" in
            ""|TODO*)
              echo "version $version is not pinned; run scripts/update-lock.sh $version" >&2
              exit 1
              ;;
          esac
          {
            echo "url=$(printf '%s' "$row" | cut -f2)"
            echo "sha=$sha"
            echo "cflags=$(printf '%s' "$row" | cut -f4)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One compile, then one cheap final stage per carrier. The point release
      # is read from the carrier image itself, never assumed, so the exact tag
      # cannot disagree with what ends up inside.
      - name: Build and push carriers
        id: carriers
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          URL: ${{ needs.resolve.outputs.url }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CFLAGS_EXTRA: ${{ needs.resolve.outputs.cflags }}
          BASELINE: ${{ needs.resolve.outputs.baseline }}
          GLIBC: ${{ needs.resolve.outputs.glibc }}
          ARCHIVED: ${{ needs.resolve.outputs.archived }}
          ARCH: ${{ matrix.arch }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          POINTS: ${{ needs.resolve.outputs.points }}
        run: |
          set -eux
          label() { docker image inspect "libfaketime:$1" --format "{{ index .Config.Labels \"$2\" }}"; }
          check() {
            actual="$(label "$1" "$2")"
            if [ "$actual" != "$3" ]; then
              echo "carrier $1: label $2 is '$actual', expected '$3'" >&2
              exit 1
            fi
          }

          pushed=0
          while IFS=$'\t' read -r distro carrier _alias; do
            case "$distro" in ''|'#'*) continue ;; esac

            point="$(printf '%s' "$POINTS" | jq -r --arg d "$distro" '.[$d]')"
            case "$point" in
              ""|null) echo "no point release resolved for $distro" >&2; exit 1 ;;
            esac
            exact="v${VERSION}-glibc${GLIBC}-debian${point}"
            major="v${VERSION}-glibc${GLIBC}-debian${distro}"

            # The exact tag is the only one unique to this build; the other two
            # move with upstream point releases, so existence is decided on it.
            if [ "${FORCE:-false}" != "true" ] && docker manifest inspect "$IMAGE:$exact" > /dev/null 2>&1; then
              echo "$IMAGE:$exact already published; skipping $distro"
              continue
            fi

            docker build \
              --build-arg BASE_TAG="$BASELINE" \
              --build-arg GLIBC="$GLIBC" \
              --build-arg APT_ARCHIVE="$ARCHIVED" \
              --build-arg FINAL_BASE="$carrier" \
              --build-arg LIBFAKETIME_VERSION="$VERSION" \
              --build-arg LIBFAKETIME_URL="$URL" \
              --build-arg LIBFAKETIME_SHA256="$SHA" \
              --build-arg EXTRA_CFLAGS="$CFLAGS_EXTRA" \
              --build-arg IMAGE_VERSION="$exact" \
              --build-arg VCS_REF="$(git rev-parse --short HEAD)" \
              --build-arg RELEASE_TAG="${{ needs.resolve.outputs.tag }}" \
              -t "libfaketime:$distro" .

            check "$distro" org.opencontainers.image.version "$exact"
            check "$distro" com.libfaketime.version "$VERSION"
            check "$distro" com.libfaketime.source.sha256 "$SHA"
            check "$distro" com.libfaketime.build.glibc "$GLIBC"
            check "$distro" com.libfaketime.build.base "debian:$BASELINE"
            check "$distro" com.libfaketime.runtime.base "debian:$carrier"

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "dry run: would push $IMAGE:$exact-$ARCH"
            else
              docker tag "libfaketime:$distro" "$IMAGE:$exact-$ARCH"
              docker push "$IMAGE:$exact-$ARCH"
            fi

            echo "debian$distro: $carrier -> $point"
            echo "- `$exact` / `$major` from $carrier ($point, $ARCH)" >> "$GITHUB_STEP_SUMMARY"
            pushed=$((pushed + 1))
          done < docker/bases.lock

          echo "pushed $pushed carrier(s) for $ARCH"

          # Re-running a finished release must stay green: when every carrier is
          # already published nothing was built, so there is nothing to probe.
          built=""
          while IFS=$'\t' read -r distro _carrier _alias; do
            case "$distro" in ''|'#'*) continue ;; esac
            if docker image inspect "libfaketime:$distro" > /dev/null 2>&1; then built="$distro"; break; fi
          done < docker/bases.lock
          echo "built=${built:-none}" >> "$GITHUB_OUTPUT"

          if [ -n "$built" ]; then
            # The library is identical in every carrier, so one probe covers all.
            CONTAINER_ENGINE=docker GLIBC_FLOOR="$GLIBC" ./test.sh "libfaketime:$built"
          fi

      # Every carrier of one architecture is supposed to ship the identical
      # file. Asserting it is what makes a single compatibility run cover all
      # three carriers; without the check that would be an assumption.
      - name: Assert every carrier ships the same library
        if: steps.carriers.outputs.built != 'none'
        run: |
          set -eux
          sums=""
          while IFS=$'\t' read -r distro _carrier _alias; do
            case "$distro" in ''|'#'*) continue ;; esac
            if ! docker image inspect "libfaketime:$distro" > /dev/null 2>&1; then continue; fi
            cid="$(docker create "libfaketime:$distro")"
            s="$(docker cp "$cid:/usr/local/lib/faketime/libfaketime.so.1" - | sha256sum | cut -d' ' -f1)"
            docker rm -v "$cid" > /dev/null
            echo "carrier $distro: $s"
            sums="$sums $s"
          done < docker/bases.lock
          count="$(printf '%s\n' $sums | sort -u | grep -c .)"
          if [ "$count" != "1" ]; then
            echo "carriers ship different libraries ($count distinct hashes)" >&2
            exit 1
          fi

      # "How compatible is this build" means: the same library under each
      # runtime glibc, on each architecture. Both arches run it and the assets
      # job merges the rows, because a release's compatibility is not per-arch:
      # the arch column is what distinguishes them.
      - name: Compatibility matrix
        if: steps.carriers.outputs.built != 'none'
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          GLIBC: ${{ needs.resolve.outputs.glibc }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          # One row per carrier: the library is identical everywhere, but the
          # glibc it runs on is not, so each image is its own environment. The
          # local images are retagged to their published name first, so the
          # table reads like the tags users actually pull.
          refs=''
          while IFS=$'\t' read -r distro carrier _alias; do
            case "$distro" in ''|'#'*) continue ;; esac
            if ! docker image inspect "libfaketime:$distro" > /dev/null 2>&1; then
              echo "carrier $distro was already published; skipping its row"
              continue
            fi
            point="$(printf '%s' "$POINTS" | jq -r --arg d "$distro" '.[$d]')"
            ref="$IMAGE:v${VERSION}-glibc${GLIBC}-debian${point}"
            docker tag "libfaketime:$distro" "$ref"
            refs="$refs $ref"
          done < docker/bases.lock

          out="compat-$ARCH.md"
          FORMAT=markdown ./scripts/capabilities.sh $refs > "$out"
          {
            echo "## Compatibility ($ARCH): libfaketime ${VERSION} (glibc ${GLIBC})"
            echo
            cat "$out"
          } >> "$GITHUB_STEP_SUMMARY"

          # The assets job rebuilds the header, so only the data rows travel.
          tail -n +3 "$out" > "compat-$ARCH.rows"

      - name: Package binary artifact
        if: steps.carriers.outputs.built != 'none'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GLIBC: ${{ needs.resolve.outputs.glibc }}
          ARCH: ${{ matrix.arch }}
          BUILT: ${{ steps.carriers.outputs.built }}
        run: |
          set -eux
          name="libfaketime-${VERSION}-glibc${GLIBC}-${ARCH}"
          # The archive mirrors the image layout, so it can be unpacked straight
          # into / with tar -C / -xzf. Both directories must exist first: docker
          # cp refuses a destination whose parent is missing, and without the
          # trailing /. it would drop the faketime/ level.
          mkdir -p "dist/$name/lib/faketime" "dist/$name/bin"
          cid="$(docker create "libfaketime:$BUILT")"
          docker cp "$cid:/usr/local/lib/faketime/." "dist/$name/lib/faketime"
          docker cp "$cid:/usr/local/bin/faketime" "dist/$name/bin/faketime"
          docker cp "$cid:/usr/src" "dist/$name/src"
          docker rm -v "$cid" > /dev/null
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        if: steps.carriers.outputs.built != 'none'
        with:
          name: dist-${{ matrix.arch }}
          path: |
            libfaketime-*.tar.gz*
            compat-*.rows
          if-no-files-found: ignore

  merge:
    name: merge-debian${{ matrix.distro }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.resolve.outputs.carriers) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the tag hierarchy
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          GLIBC: ${{ needs.resolve.outputs.glibc }}
          DISTRO: ${{ matrix.distro }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          POINTS: ${{ needs.resolve.outputs.points }}
        run: |
          set -eux
          row="$(awk -F'\t' -v d="$DISTRO" '!/^#/ && $1 == d { print }' docker/bases.lock)"
          carrier="$(printf '%s' "$row" | cut -f2)"
          alias="$(printf '%s' "$row" | cut -f3)"
          point="$(printf '%s' "$POINTS" | jq -r --arg d "$DISTRO" '.[$d]')"
          case "$point" in
            ""|null) echo "no point release resolved for $DISTRO" >&2; exit 1 ;;
          esac

          exact="v${VERSION}-glibc${GLIBC}-debian${point}"
          major="v${VERSION}-glibc${GLIBC}-debian${DISTRO}"
          short="v${VERSION}-glibc${GLIBC}"

          create() {
            docker buildx imagetools create -t "$IMAGE:$1" \
              "$IMAGE:$exact-amd64" "$IMAGE:$exact-arm64"
            platforms="$(docker buildx imagetools inspect "$IMAGE:$1" | grep -c 'Platform:')"
            if [ "$platforms" -lt 2 ]; then
              echo "expected 2 platforms in $1, found $platforms" >&2
              exit 1
            fi
            echo "published $1"
          }

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry run: would create $IMAGE:$exact, $IMAGE:$major"
            if [ -n "$alias" ]; then echo "dry run: would create $IMAGE:$short"; fi
            exit 0
          fi

          # The exact tag is a snapshot: once published it must never move, so
          # a rebuild against a newer point release adds a tag instead of
          # rewriting this one.
          if [ "${FORCE:-false}" = "true" ] || ! docker manifest inspect "$IMAGE:$exact" > /dev/null 2>&1; then
            create "$exact"
          else
            echo "$exact already published; leaving it alone"
          fi

          # The other two are pointers, not snapshots. When upstream ships 13.8,
          # -debian13 and -glibc<abi> must follow it; skipping them because they
          # already exist would strand every user on the previous point release.
          create "$major"
          # The short tag follows whichever carrier is marked alias=1, so the
          # "newest stable" answer is declared in docker/bases.lock, not guessed.
          if [ -n "$alias" ]; then
            create "$short"
          fi

  assets:
    name: publish-artifacts
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Nothing is downloaded when every carrier was already published, and that
      # is not an error.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # One table for the whole release: both architectures, every carrier. The
      # per-arch jobs each ship their data rows, the header is assembled here so
      # it can never disagree with what follows.
      - name: Assemble the compatibility table
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GLIBC: ${{ needs.resolve.outputs.glibc }}
        run: |
          set -eux
          mkdir -p dist
          ls -l dist

          out="dist/libfaketime-${VERSION}-glibc${GLIBC}-compatibility.md"
          if compgen -G "dist/compat-*.rows" > /dev/null; then
            {
              echo "## Compatibility: libfaketime ${VERSION} (glibc ${GLIBC})"
              echo
              echo '| image | arch | glibc | offset | freeze | anchor | sleep_ms | stat | touch |'
              echo '|---|---|---|---|---|---|---|---|---|'
              cat dist/compat-*.rows | sort
            } > "$out"
            rm -f dist/compat-*.rows
            cat "$out"
          else
            echo "no compatibility rows were produced; nothing to publish"
          fi

      - uses: softprops/action-gh-release@v2
        if: hashFiles('dist/libfaketime-*.tar.gz') != ''
        with:
          files: |
            dist/libfaketime-*.tar.gz*
            dist/libfaketime-*-compatibility.md
          # Without this a workflow_dispatch run would attach the release to the
          # branch it was dispatched from instead of the intended tag.
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: libfaketime ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
