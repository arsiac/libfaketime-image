name: Release

# Publishes every (baseline, carrier) pair with exact, distro-line and, on the
# alias carrier, short tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "libfaketime version, e.g. 0.9.13"
        required: true
      force:
        description: "rebuild and overwrite already published tags"
        type: boolean
        default: false
      dry_run:
        description: "build and verify everything, push nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      url: ${{ steps.pin.outputs.url }}
      sha: ${{ steps.pin.outputs.sha }}
      cflags: ${{ steps.pin.outputs.cflags }}
      pairs: ${{ steps.pairs.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      # Versions contain no hyphen, so a tag is <version>[-<release revision>].
      # Event and input values go through env vars, never into shell syntax.
      - name: Derive version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            tag="v${tag#v}"          # accept both 0.9.13 and v0.9.13
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          version="${version%%-*}"
          case "$version" in
            *[!0-9.]*|"")
              echo "cannot read a version out of tag '$tag'" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Read build baselines
        id: bases
        run: |
          list="["
          while IFS=$'\t' read -r image glibc archived make_mode; do
            case "$image" in ''|'#'*) continue ;; esac
            case "$glibc" in
              ''|*[!0-9.]*)
                echo "baseline $image has no valid glibc value" >&2
                exit 1
                ;;
            esac
            if [ -z "$make_mode" ]; then
              echo "baseline $image has no make value" >&2
              exit 1
            fi
            list="$list{\"image\":\"$image\",\"glibc\":\"$glibc\",\"archived\":\"$archived\",\"make\":\"$make_mode\"},"
          done < docker/build-base.lock
          list="${list%,}]"
          if [ "$list" = "[]" ]; then
            echo "docker/build-base.lock has no baselines" >&2
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # Resolve each carrier once, pair it with baselines at or below its
      # glibc, and require the alias carrier to carry every baseline.
      - name: Resolve carrier pairs
        id: pairs
        env:
          BASELINES: ${{ steps.bases.outputs.list }}
        run: |
          set -eux
          lower_than() { [ "$1" != "$2" ] && [ "$1" = "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" ]; }

          pairs="["
          while IFS=$'\t' read -r distro carrier locked_glibc alias; do
            case "$distro" in ''|'#'*) continue ;; esac
            case "$locked_glibc" in
              ''|*[!0-9.]*)
                echo "carrier for distro $distro has no valid glibc value" >&2
                exit 1
                ;;
            esac

            info="$(docker run --rm "debian:$carrier" sh -c 'cat /etc/debian_version; getconf GNU_LIBC_VERSION | cut -d" " -f2')"
            point="$(printf '%s\n' "$info" | sed -n 1p)"
            carrier_glibc="$(printf '%s\n' "$info" | sed -n 2p)"
            case "$point" in
              ''|*[!0-9.]*)
                echo "no point release resolved for debian:$carrier" >&2
                exit 1
                ;;
            esac
            if [ "$carrier_glibc" != "$locked_glibc" ]; then
              echo "docker/bases.lock says $carrier runs glibc $locked_glibc, image reports $carrier_glibc" >&2
              exit 1
            fi

            while read -r base; do
              glibc="$(printf '%s' "$base" | jq -r '.glibc')"
              baseline="$(printf '%s' "$base" | jq -r '.image')"
              archived="$(printf '%s' "$base" | jq -r '.archived')"
              make_mode="$(printf '%s' "$base" | jq -r '.make')"
              if lower_than "$carrier_glibc" "$glibc"; then
                if [ -n "$alias" ]; then
                  echo "alias carrier $carrier (glibc $carrier_glibc) cannot carry baseline glibc $glibc" >&2
                  exit 1
                fi
                echo "skip debian$distro ($carrier, glibc $carrier_glibc) for baseline glibc $glibc"
                continue
              fi
              pairs="$pairs{\"glibc\":\"$glibc\",\"baseline\":\"$baseline\",\"archived\":\"$archived\",\"make\":\"$make_mode\",\"distro\":\"$distro\",\"carrier\":\"$carrier\",\"point\":\"$point\",\"alias\":\"$alias\",\"carrier_glibc\":\"$carrier_glibc\"},"
            done < <(printf '%s' "$BASELINES" | jq -c '.[]')
          done < docker/bases.lock
          pairs="${pairs%,}]"

          while read -r glibc; do
            n="$(printf '%s' "$pairs" | jq --arg g "$glibc" '[.[] | select(.glibc == $g)] | length')"
            if [ "$n" -eq 0 ]; then
              echo "no carrier can carry baseline glibc $glibc" >&2
              exit 1
            fi
          done < <(printf '%s' "$BASELINES" | jq -r '.[].glibc')

          echo "pairs=$pairs"
          echo "list=$pairs" >> "$GITHUB_OUTPUT"

      - name: Read pin from docker/versions.lock
        id: pin
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          row="$(awk -F'\t' -v v="$VERSION" '!/^#/ && $1 == v { print; found = 1 } END { if (!found) exit 1 }' docker/versions.lock)" || {
            echo "version $VERSION is not listed in docker/versions.lock" >&2
            exit 1
          }
          sha="$(printf '%s' "$row" | cut -f3)"
          case "$sha" in
            ""|TODO*)
              echo "version $VERSION is not pinned; run scripts/update-lock.sh $VERSION" >&2
              exit 1
              ;;
          esac
          {
            echo "url=$(printf '%s' "$row" | cut -f2)"
            echo "sha=$sha"
            echo "cflags=$(printf '%s' "$row" | cut -f4)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One compile per baseline, one cheap final stage per compatible carrier;
      # the point release is read from the image.
      - name: Build and push carriers
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          URL: ${{ needs.resolve.outputs.url }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CFLAGS_EXTRA: ${{ needs.resolve.outputs.cflags }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
          ARCH: ${{ matrix.arch }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eux
          label() { docker image inspect "libfaketime:$1" --format "{{ index .Config.Labels \"$2\" }}"; }
          check() {
            actual="$(label "$1" "$2")"
            if [ "$actual" != "$3" ]; then
              echo "carrier $1: label $2 is '$actual', expected '$3'" >&2
              exit 1
            fi
          }

          digests="digests-$ARCH.txt"
          : > "$digests"
          pushed=0
          while read -r pair; do
            glibc="$(printf '%s' "$pair" | jq -r '.glibc')"
            baseline="$(printf '%s' "$pair" | jq -r '.baseline')"
            archived="$(printf '%s' "$pair" | jq -r '.archived')"
            make_mode="$(printf '%s' "$pair" | jq -r '.make')"
            distro="$(printf '%s' "$pair" | jq -r '.distro')"
            carrier="$(printf '%s' "$pair" | jq -r '.carrier')"
            point="$(printf '%s' "$pair" | jq -r '.point')"

            local="libfaketime:$glibc-$distro"
            exact="v${VERSION}-glibc${glibc}-debian${point}"
            major="v${VERSION}-glibc${glibc}-debian${distro}"

            # Only the exact tag is unique to this build, so existence is decided on it.
            if [ "${FORCE:-false}" != "true" ] && docker manifest inspect "$IMAGE:$exact" > /dev/null 2>&1; then
              # Reuse the published image so a rerun still packages assets.
              echo "$IMAGE:$exact already published; reusing it for glibc$glibc debian$distro"
              docker pull "$IMAGE:$exact"
              docker tag "$IMAGE:$exact" "$local"
              echo "- \`$exact\` / \`$major\` from $carrier (already published)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # The local image is what gets tested, probed and packaged.
            args=(
              --build-arg "BASE_TAG=$baseline"
              --build-arg "GLIBC=$glibc"
              --build-arg "APT_ARCHIVE=$archived"
              --build-arg "TOOLCHAIN_MAKE=$make_mode"
              --build-arg "FINAL_BASE=$carrier"
              --build-arg "LIBFAKETIME_VERSION=$VERSION"
              --build-arg "LIBFAKETIME_URL=$URL"
              --build-arg "LIBFAKETIME_SHA256=$SHA"
              --build-arg "EXTRA_CFLAGS=$CFLAGS_EXTRA"
              --build-arg "IMAGE_VERSION=$exact"
              --build-arg "VCS_REF=$(git rev-parse --short HEAD)"
              --build-arg "RELEASE_TAG=$RELEASE_TAG"
            )
            docker buildx build "${args[@]}" --load -t "$local" .

            check "$glibc-$distro" org.opencontainers.image.version "$exact"
            check "$glibc-$distro" com.libfaketime.version "$VERSION"
            check "$glibc-$distro" com.libfaketime.source.sha256 "$SHA"
            check "$glibc-$distro" com.libfaketime.build.glibc "$glibc"
            check "$glibc-$distro" com.libfaketime.build.base "debian:$baseline"
            check "$glibc-$distro" com.libfaketime.runtime.base "debian:$carrier"

            # Push each single-platform manifest by digest; no per-arch tag is published.
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "dry run: would push glibc$glibc debian$distro as $IMAGE@<digest>"
            else
              meta="meta-$glibc-$distro.json"
              docker buildx build "${args[@]}" \
                --provenance=false --sbom=false \
                --output "type=image,name=$IMAGE,push=true,push-by-digest=true,name-canonical=true" \
                --metadata-file "$meta" .
              digest="$(jq -r '."containerimage.digest"' "$meta")"
              case "$digest" in
                ""|null) echo "no digest returned for glibc$glibc debian$distro" >&2; exit 1 ;;
              esac
              echo "$glibc $distro $digest" >> "$digests"
            fi

            echo "baseline glibc $glibc, debian$distro: $carrier -> $point"
            echo "- \`$exact\` / \`$major\` from $carrier ($point, $ARCH)" >> "$GITHUB_STEP_SUMMARY"
            pushed=$((pushed + 1))
          done < <(printf '%s' "$PAIRS" | jq -c '.[]')

          echo "pushed $pushed carrier image(s) for $ARCH"

          # The library is identical within a baseline, so one probe per
          # baseline covers its carriers.
          while read -r glibc; do
            ref="$(printf '%s' "$PAIRS" | jq -r --arg g "$glibc" '[.[] | select(.glibc == $g)][0] | "\(.glibc)-\(.distro)"')"
            if ! docker image inspect "libfaketime:$ref" > /dev/null 2>&1; then
              echo "no local image for baseline glibc $glibc ($ref)" >&2
              exit 1
            fi
            CONTAINER_ENGINE=docker GLIBC_FLOOR="$glibc" ./test.sh "libfaketime:$ref"
          done < <(printf '%s' "$PAIRS" | jq -r '[.[].glibc] | unique | .[]')

      # Carriers of one baseline must ship the same library, or the single
      # probe proves nothing.
      - name: Assert each baseline ships the same library
        env:
          PAIRS: ${{ needs.resolve.outputs.pairs }}
        run: |
          set -eux
          declare -A seen
          while read -r pair; do
            glibc="$(printf '%s' "$pair" | jq -r '.glibc')"
            distro="$(printf '%s' "$pair" | jq -r '.distro')"
            image="libfaketime:$glibc-$distro"
            docker image inspect "$image" > /dev/null
            cid="$(docker create "$image")"
            s="$(docker cp "$cid:/usr/local/lib/faketime/libfaketime.so.1" - | sha256sum | cut -d' ' -f1)"
            docker rm -v "$cid" > /dev/null
            echo "baseline glibc $glibc, carrier $distro: $s"
            if [ -n "${seen[$glibc]:-}" ] && [ "${seen[$glibc]}" != "$s" ]; then
              echo "carriers of baseline glibc $glibc ship different libraries" >&2
              exit 1
            fi
            seen[$glibc]="$s"
          done < <(printf '%s' "$PAIRS" | jq -c '.[]')

      # Compatibility is measured per runtime glibc and architecture; the
      # assets job merges both arches.
      - name: Compatibility matrix
        env:
          IMAGE: arsiachou/libfaketime
          CONTAINER_ENGINE: docker
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
        run: |
          set -eux
          # One row per pair: same library, different runtime glibc. Retag
          # local images to their published names first.
          refs=''
          while read -r pair; do
            glibc="$(printf '%s' "$pair" | jq -r '.glibc')"
            distro="$(printf '%s' "$pair" | jq -r '.distro')"
            point="$(printf '%s' "$pair" | jq -r '.point')"
            ref="$IMAGE:v${VERSION}-glibc${glibc}-debian${point}"
            docker tag "libfaketime:$glibc-$distro" "$ref"
            refs="$refs $ref"
          done < <(printf '%s' "$PAIRS" | jq -c '.[]')

          out="compat-$ARCH.md"
          FORMAT=markdown ./scripts/capabilities.sh $refs > "$out"
          {
            echo "## Compatibility ($ARCH): libfaketime ${VERSION}"
            echo
            cat "$out"
          } >> "$GITHUB_STEP_SUMMARY"

          # The assets job rebuilds the header, so only the data rows travel.
          tail -n +3 "$out" > "compat-$ARCH.rows"

      - name: Package binary artifacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
        run: |
          set -eux
          while read -r glibc; do
            # Prefer the alias carrier so the archive matches the short tag. The
            # archive mirrors /, so it unpacks with tar -C /; docker cp needs the
            # parent directories and the trailing /.
            image="$(printf '%s' "$PAIRS" | jq -r --arg g "$glibc" '
              (([.[] | select(.glibc == $g and .alias == "1")][0]) //
               ([.[] | select(.glibc == $g)][0])) |
              "\(.glibc)-\(.distro)"')"
            name="libfaketime-${VERSION}-glibc${glibc}-${ARCH}"
            mkdir -p "dist/$name/lib/faketime" "dist/$name/bin"
            cid="$(docker create "libfaketime:$image")"
            docker cp "$cid:/usr/local/lib/faketime/." "dist/$name/lib/faketime"
            docker cp "$cid:/usr/local/bin/faketime" "dist/$name/bin/faketime"
            docker cp "$cid:/usr/src" "dist/$name/src"
            docker rm -v "$cid" > /dev/null
            tar -C dist -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          done < <(printf '%s' "$PAIRS" | jq -r '[.[].glibc] | unique | .[]')

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            libfaketime-*.tar.gz*
            compat-*.rows
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests-*.txt
          if-no-files-found: error

  merge:
    name: merge-glibc${{ matrix.glibc }}-debian${{ matrix.distro }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v5

      # Turn the per-arch digests into a multi-arch tag.
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the tag hierarchy
        env:
          IMAGE: arsiachou/libfaketime
          VERSION: ${{ needs.resolve.outputs.version }}
          GLIBC: ${{ matrix.glibc }}
          DISTRO: ${{ matrix.distro }}
          POINT: ${{ matrix.point }}
          ALIAS: ${{ matrix.alias }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eux
          case "$POINT" in
            ""|null) echo "no point release resolved for glibc $GLIBC debian$DISTRO" >&2; exit 1 ;;
          esac

          exact="v${VERSION}-glibc${GLIBC}-debian${POINT}"
          major="v${VERSION}-glibc${GLIBC}-debian${DISTRO}"
          short="v${VERSION}-glibc${GLIBC}"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry run: would create $IMAGE:$exact, $IMAGE:$major"
            if [ -n "$ALIAS" ]; then echo "dry run: would create $IMAGE:$short"; fi
            exit 0
          fi

          amd="$(awk -v g="$GLIBC" -v d="$DISTRO" '$1 == g && $2 == d { print $3 }' digests/digests-amd64.txt)"
          arm="$(awk -v g="$GLIBC" -v d="$DISTRO" '$1 == g && $2 == d { print $3 }' digests/digests-arm64.txt)"
          if [ -z "$amd" ] || [ -z "$arm" ]; then
            # Nothing was rebuilt: read the digests from the published index.
            raw="$(docker buildx imagetools inspect --raw "$IMAGE:$exact")"
            amd="$(printf '%s' "$raw" | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')"
            arm="$(printf '%s' "$raw" | jq -r '.manifests[] | select(.platform.architecture == "arm64") | .digest')"
          fi

          create() {
            docker buildx imagetools create -t "$IMAGE:$1" \
              "$IMAGE@$amd" "$IMAGE@$arm"
            platforms="$(docker buildx imagetools inspect "$IMAGE:$1" | grep -c 'Platform:')"
            if [ "$platforms" -lt 2 ]; then
              echo "expected 2 platforms in $1, found $platforms" >&2
              exit 1
            fi
            echo "published $1"
          }

          # Exact tags are snapshots and never move.
          if [ "${FORCE:-false}" = "true" ] || ! docker manifest inspect "$IMAGE:$exact" > /dev/null 2>&1; then
            create "$exact"
          else
            echo "$exact already published; leaving it alone"
          fi

          # Distro-line and short tags are pointers and must follow new point releases.
          create "$major"
          # The alias=1 carrier decides which tag the short name follows.
          if [ -n "$ALIAS" ]; then
            create "$short"
          fi

  assets:
    name: publish-artifacts
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Every arch must upload assets; a missing one fails the release.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # One compatibility table for both architectures, header assembled here.
      - name: Assemble the compatibility table
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -eux
          mkdir -p dist
          ls -l dist

          if ! compgen -G "dist/compat-*.rows" > /dev/null; then
            echo "no compatibility rows were produced" >&2
            exit 1
          fi

          out="dist/libfaketime-${VERSION}-compatibility.md"
          {
            echo "## Compatibility: libfaketime ${VERSION}"
            echo
            echo '| image | arch | glibc | offset | freeze | anchor | sleep_ms | stat | touch |'
            echo '|---|---|---|---|---|---|---|---|---|'
            cat dist/compat-*.rows | sort
          } > "$out"
          rm -f dist/compat-*.rows
          cat "$out"

      - uses: softprops/action-gh-release@v2
        if: inputs.dry_run != true
        with:
          files: |
            dist/libfaketime-*.tar.gz*
            dist/libfaketime-*-compatibility.md
          # Pin the release to the intended tag, not the dispatched branch.
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: libfaketime ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          # A rerun replaces existing assets instead of failing.
          overwrite_files: true
