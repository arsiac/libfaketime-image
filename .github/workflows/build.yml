name: CI

# Build only, never push. Publishing belongs to release.yml.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      # CI builds the newest release in the lock file; the version matrix is a
      # release-time concern.
      - name: Read pin
        id: pin
        run: |
          row="$(awk -F'\t' '!/^#/ && NF { last = $0 } END { print last }' docker/versions.lock)"
          {
            echo "version=$(printf '%s' "$row" | cut -f1)"
            echo "url=$(printf '%s' "$row" | cut -f2)"
            echo "sha=$(printf '%s' "$row" | cut -f3)"
            echo "cflags=$(printf '%s' "$row" | cut -f4)"
          } >> "$GITHUB_OUTPUT"

      # One compile per baseline; skip carriers below its glibc and verify the
      # locked glibc against the image.
      - name: Build carriers
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          URL: ${{ steps.pin.outputs.url }}
          SHA: ${{ steps.pin.outputs.sha }}
          CFLAGS_EXTRA: ${{ steps.pin.outputs.cflags }}
        run: |
          set -eux
          lower_than() { [ "$1" != "$2" ] && [ "$1" = "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" ]; }

          while IFS=$'\t' read -r baseline glibc archived; do
            case "$baseline" in ''|'#'*) continue ;; esac
            probe=""
            while IFS=$'\t' read -r distro carrier carrier_glibc _alias; do
              case "$distro" in ''|'#'*) continue ;; esac
              case "$carrier_glibc" in ''|*[!0-9.]*)
                echo "carrier for distro $distro has no glibc value" >&2
                exit 1
                ;;
              esac
              if lower_than "$carrier_glibc" "$glibc"; then
                echo "skip debian$distro ($carrier, glibc $carrier_glibc) for baseline glibc $glibc"
                continue
              fi

              tag="$glibc-$distro"
              docker build \
                --build-arg BASE_TAG="$baseline" \
                --build-arg GLIBC="$glibc" \
                --build-arg APT_ARCHIVE="$archived" \
                --build-arg FINAL_BASE="$carrier" \
                --build-arg LIBFAKETIME_VERSION="$VERSION" \
                --build-arg LIBFAKETIME_URL="$URL" \
                --build-arg LIBFAKETIME_SHA256="$SHA" \
                --build-arg EXTRA_CFLAGS="$CFLAGS_EXTRA" \
                --build-arg IMAGE_VERSION="v$VERSION-glibc$glibc-debian$distro" \
                --build-arg VCS_REF="$(git rev-parse --short HEAD)" \
                --build-arg RELEASE_TAG="ci-$(git rev-parse --short HEAD)" \
                -t "libfaketime:$tag" .

              info="$(docker run --rm "libfaketime:$tag" sh -c 'cat /etc/debian_version; getconf GNU_LIBC_VERSION | cut -d" " -f2')"
              point="$(printf '%s\n' "$info" | sed -n 1p)"
              actual_glibc="$(printf '%s\n' "$info" | sed -n 2p)"
              if [ "$actual_glibc" != "$carrier_glibc" ]; then
                echo "docker/bases.lock says $carrier runs glibc $carrier_glibc, image reports $actual_glibc" >&2
                exit 1
              fi
              echo "baseline glibc $glibc, debian$distro -> $carrier resolved to $point (glibc $actual_glibc)"
              if [ -z "$probe" ]; then probe="$tag"; fi
            done < docker/bases.lock

            if [ -z "$probe" ]; then
              echo "no carrier can carry baseline glibc $glibc" >&2
              exit 1
            fi
            CONTAINER_ENGINE=docker GLIBC_FLOOR="$glibc" ./test.sh "libfaketime:$probe"
          done < docker/build-base.lock
