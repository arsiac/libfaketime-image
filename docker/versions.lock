# libfaketime releases shipped by this repository.
# Columns are tab separated:
#   version   url   sha256   extra_cflags
#
# This repository packages upstream releases faithfully: one image per release,
# built on one fixed ABI baseline. How a release behaves is a property of that
# release, not a gate on this build. The matrix exists to make the differences
# visible, not to hide them.
#
# Measured behaviour, for reference only (nothing enforces this):
#
#   version        11.11 (2.31)  12.15 (2.36)  13.7 (2.41)   file timestamps
#   0.9.7 - 0.9.10  ok            ok            ok            not faked
#   0.9.11, 0.9.12  hangs         ok            ok            faked
#   0.9.13          ok            ok            ok            faked
#
# "hangs" means every preloaded process blocks during initialisation, and only
# on glibc 2.31. The compiled artifact is sound; those releases simply do not
# work on the bullseye target, which is worth knowing but is not our defect.
# Releases up to 0.9.10 do not intercept statx(), so modern coreutils report
# real file timestamps; that too is upstream behaviour.
#
# sha256 "TODO" means not pinned yet; the build refuses to run until
# scripts/update-lock.sh has filled it in.
#
# extra_cflags is appended to the flags used by src/Makefile, which already
# enables FAKE_PTHREAD, FAKE_STAT, FAKE_UTIME, FAKE_SLEEP, FAKE_TIMERS and
# FAKE_INTERNAL_CALLS. Releases older than the current GCC warning set need
# individual -Wno-error= entries here; nothing else should be added without a
# reason recorded next to it. test.sh applies the preload per command rather
# than exporting it, so FAKE_SLEEP does not distort its measurements.
#
# If a release tag is not published with a "v" prefix upstream, fix that row's
# url; update-lock.sh will fail loudly on a 404.
