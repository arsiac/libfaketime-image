# Runtime carriers.
# Columns are tab separated:
#   distro   image   alias
#
# The artifact is built once (see docker/build-base.lock) and copied into each
# of these images, so the .so inside all of them is the same file. The carrier
# only decides which base system users pull, not what the library can do.
#
# Tags float on the newest point release of each major. Each carrier publishes
# under the point release it actually resolved to and under the bare major, and
# the carrier marked alias=1 also publishes the short tag with no distro
# suffix. So one build answers all of:
#   v0.9.13-glibc2.31-debian11.11   exact
#   v0.9.13-glibc2.31-debian11      follows 11.x
#   v0.9.13-glibc2.31               follows the alias carrier (newest stable)
11	11-slim
12	12-slim
13	13-slim	1
